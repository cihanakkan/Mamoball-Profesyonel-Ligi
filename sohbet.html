<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sohbet</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white p-4">
    <div class="flex justify-between mb-4">
        <h1 class="font-bold text-red-600">SOHBET</h1>
        <a href="index.html" class="text-xs bg-zinc-800 p-2 rounded">GERİ</a>
    </div>
    <div id="box" class="h-96 bg-zinc-900 rounded-xl p-4 overflow-y-auto mb-4 border border-white/5"></div>
    <div class="flex gap-2">
        <input id="in" type="text" class="flex-1 bg-zinc-800 p-3 rounded-lg outline-none">
        <button onclick="send()" class="bg-red-600 px-4 rounded-lg">OK</button>
    </div>

    <script>
        // index.html'deki localStorage verisiyle eşitledim
        const session = localStorage.getItem('mpl_user');
        if(!session) {
            alert("SOHBET İÇİN GİRİŞ YAPMALISIN!");
            location.href = "index.html";
        }
        const myName = JSON.parse(session).u;

        function send() {
            const input = document.getElementById('in');
            if(!input.value.trim()) return;
            const msgs = JSON.parse(localStorage.getItem('mpl_msgs')) || [];
            msgs.push({ u: myName, t: input.value });
            localStorage.setItem('mpl_msgs', JSON.stringify(msgs));
            input.value = "";
            render();
        }

        function render() {
            const msgs = JSON.parse(localStorage.getItem('mpl_msgs')) || [];
            document.getElementById('box').innerHTML = msgs.map(m => `
                <div class="mb-2">
                    <span class="text-red-600 text-[10px] font-bold">${m.u}:</span>
                    <span class="text-sm">${m.t}</span>
                </div>
            `).join('');
        }
        window.onload = render;
    </script>
</body>
</html>
