<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPL - Canlı Sohbet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: white; font-family: sans-serif; margin: 0; overflow: hidden; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(220, 38, 38, 0.3); }
    </style>
</head>
<body class="h-screen flex flex-col">

    <div class="glass p-4 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="w-2 h-2 bg-red-600 rounded-full animate-pulse"></div>
            <h1 class="font-black italic text-sm tracking-widest">MPL GLOBAL CHAT</h1>
        </div>
        <a href="index.html" class="text-[10px] bg-zinc-800 px-4 py-2 rounded-lg font-bold">GERİ DÖN</a>
    </div>

    <div class="flex-1 w-full">
        <iframe src="https://www3.cbox.ws/box/?boxid=3534565&boxtag=mplchat" 
                width="100%" 
                height="100%" 
                allowtransparency="yes" 
                allow="autoplay" 
                frameborder="0" 
                marginheight="0" 
                marginwidth="0" 
                scrolling="auto">
        </iframe>
    </div>

    <script>
        // Giriş kontrolü (Hala lazım ki yabancılar girmesin)
        const session = localStorage.getItem('mpl_user');
        if(!session) {
            alert("SOHBETE ERİŞMEK İÇİN GİRİŞ YAPMALISIN!");
            location.href = "index.html";
        }
    </script>
</body>
</html>
