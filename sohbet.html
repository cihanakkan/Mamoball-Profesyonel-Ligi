<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPL - Sohbet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #000; color: white; margin: 0; }
        .title-font { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .chat-box { height: 400px; overflow-y: auto; scrollbar-width: none; }
        .chat-box::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen pb-20">
    <header class="py-10 text-center glass border-b border-red-900/20">
        <h1 class="text-3xl title-font font-black italic uppercase text-white">MPL <span class="text-red-600">SOHBET</span></h1>
        <a href="index.html" class="text-[10px] tracking-widest text-zinc-500 hover:text-white transition mt-4 inline-block font-bold uppercase">← ANA MENÜ</a>
    </header>

    <main class="max-w-2xl mx-auto px-6 mt-8 space-y-6">
        <div class="glass rounded-[2rem] p-6 border border-white/5">
            <div id="chat-messages" class="chat-box space-y-4 mb-6 pr-2">
                </div>
            
            <div class="flex gap-2">
                <input type="text" id="chat-msg" placeholder="MESAJINI YAZ..." class="w-full bg-black/40 p-4 rounded-xl text-xs font-bold outline-none border border-white/5 focus:border-red-600 transition">
                <button onclick="mesajGonder()" class="bg-red-600 px-6 rounded-xl font-black uppercase text-xs shadow-lg hover:scale-105 transition">GÖNDER</button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="glass p-6 rounded-[2rem] border border-white/5">
                <h2 class="text-[10px] font-black uppercase text-red-500 mb-4 tracking-widest italic">ARKADAŞ EKLE</h2>
                <div class="flex gap-2">
                    <input type="text" id="friend-name" placeholder="KULLANICI ADI" class="w-full bg-black/40 p-3 rounded-lg text-[10px] font-bold outline-none border border-white/5">
                    <button onclick="arkadasEkle()" class="bg-white/10 px-4 rounded-lg font-black text-[10px] hover:bg-white/20">EKLE</button>
                </div>
            </div>

            <div class="glass p-6 rounded-[2rem] border border-white/5">
                <h2 class="text-[10px] font-black uppercase text-zinc-500 mb-4 tracking-widest italic">ARKADAŞLARIM</h2>
                <div id="friends-list" class="space-y-2 max-h-32 overflow-y-auto">
                    </div>
            </div>
        </div>
    </main>

    <script>
        const user = JSON.parse(sessionStorage.getItem('loggedInUser'));
        
        // Giriş Kontrolü
        if(!user) {
            alert("SOHBETE KATILMAK İÇİN GİRİŞ YAPMALISIN!");
            location.href = "index.html";
        }

        function mesajlariYukle() {
            const chatBox = document.getElementById('chat-messages');
            let messages = JSON.parse(localStorage.getItem('mpl_global_chat')) || [];
            
            chatBox.innerHTML = messages.map(m => `
                <div class="flex flex-col ${m.sender === user.username ? 'items-end' : 'items-start'}">
                    <span class="text-[9px] font-black uppercase mb-1 ${m.sender === user.username ? 'text-red-500' : 'text-zinc-500'}">${m.sender}</span>
                    <div class="bg-white/5 p-3 rounded-2xl max-w-[80%] border border-white/5">
                        <p class="text-[11px] font-bold text-zinc-200">${m.text}</p>
                    </div>
                </div>
            `).join('');
            
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function mesajGonder() {
            const input = document.getElementById('chat-msg');
            const text = input.value.trim();
            if(!text) return;

            let messages = JSON.parse(localStorage.getItem('mpl_global_chat')) || [];
            messages.push({
                sender: user.username,
                text: text,
                time: new Date().toLocaleTimeString()
            });

            // Son 100 mesajı tut, gerisini sil (Hafıza şişmesin)
            if(messages.length > 100) messages.shift();

            localStorage.setItem('mpl_global_chat', JSON.stringify(messages));
            input.value = "";
            mesajlariYukle();
        }

        function arkadaslariYukle() {
            const list = document.getElementById('friends-list');
            let friends = JSON.parse(localStorage.getItem(`friends_${user.username}`)) || [];
            
            list.innerHTML = friends.length ? friends.map(f => `
                <div class="bg-white/5 p-2 rounded-lg flex justify-between items-center">
                    <span class="text-[10px] font-black uppercase text-white">${f}</span>
                    <span class="w-2 h-2 bg-green-500 rounded-full shadow-[0_0_5px_#22c55e]"></span>
                </div>
            `).join('') : "<p class='text-[9px] text-zinc-700 font-bold uppercase'>Henüz kimse yok.</p>";
        }

        function arkadasEkle() {
            const input = document.getElementById('friend-name');
            const name = input.value.trim().toUpperCase();
            
            if(!name || name === user.username) return alert("GEÇERSİZ İSİM!");

            let friends = JSON.parse(localStorage.getItem(`friends_${user.username}`)) || [];
            if(friends.includes(name)) return alert("ZATEN LİSTEDE!");

            friends.push(name);
            localStorage.setItem(`friends_${user.username}`, JSON.stringify(friends));
            input.value = "";
            arkadaslariYukle();
        }

        // Enter tuşuyla mesaj gönderme
        document.getElementById('chat-msg').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') mesajGonder();
        });

        // 3 saniyede bir yeni mesaj var mı diye kontrol et (Canlı hissi versin)
        setInterval(mesajlariYukle, 3000);

        window.onload = () => {
            mesajlariYukle();
            arkadaslariYukle();
        };
    </script>
</body>
</html>
