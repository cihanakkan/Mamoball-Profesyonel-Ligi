<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPL - Haberler</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #000; color: white; margin: 0; }
        .title-font { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="min-h-screen">
    <button onclick="adminLogin()" class="fixed top-4 right-4 z-50 p-2 glass rounded-full opacity-20">⚙️</button>
    <header class="py-12 text-center glass border-b border-red-900/20">
        <img src="./1000090222.webp" onerror="this.src='https://api.dicebear.com/7.x/initials/svg?seed=MPL&backgroundColor=dc2626&bold=true'" class="w-24 h-24 mx-auto rounded-full mb-6 shadow-2xl">
        <h1 class="text-4xl title-font font-black italic uppercase tracking-tighter text-red-600">MPL NEWS</h1>
        <a href="index.html" class="text-[10px] tracking-widest text-zinc-500 hover:text-white transition mt-4 inline-block uppercase font-bold">← ANA SAYFA</a>
    </header>
    <main class="max-w-4xl mx-auto px-6 py-12">
        <section id="news-admin" class="hidden glass p-6 rounded-[2rem] border border-red-600 mb-10 space-y-4">
            <input type="text" id="news-title" placeholder="BAŞLIK" class="w-full bg-black/50 p-4 rounded-xl border border-zinc-800 outline-none uppercase font-bold text-xs">
            <textarea id="news-content" placeholder="HABER DETAYI" class="w-full bg-black/50 p-4 rounded-xl h-24 border border-zinc-800 outline-none text-xs"></textarea>
            <button onclick="haberEkle()" class="w-full bg-red-600 p-4 rounded-xl font-black uppercase text-xs">YAYINLA</button>
        </section>
        <div id="news-container" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    </main>
    <div id="news-modal" class="fixed inset-0 bg-black/95 z-[100] hidden overflow-y-auto p-4 flex items-center justify-center">
        <div class="max-w-2xl w-full glass rounded-[3rem] p-10 relative border border-white/5">
            <button onclick="modalKapat()" class="absolute top-6 right-6 text-zinc-500 text-3xl font-black">&times;</button>
            <div id="modal-content" class="text-center"></div>
        </div>
    </div>
    <script>
        let haberler = JSON.parse(localStorage.getItem('mpl_haberler')) || [];
        function haberleriGoster() {
            const c = document.getElementById('news-container'); c.innerHTML = '';
            [...haberler].reverse().forEach((h, i) => { const ri = haberler.length-1-i;
            c.innerHTML += `<article onclick="haberAc(${ri})" class="glass p-8 rounded-[2rem] cursor-pointer hover:border-red-600 transition uppercase italic font-bold text-center"><h3 class="text-xl mb-2">${h.baslik}</h3><p class="text-[9px] text-zinc-500 tracking-widest">DEVAMINI OKU →</p></article>`; });
        }
        function haberAc(i) {
            const h = haberler[i];
            document.getElementById('modal-content').innerHTML = `<h2 class="text-3xl title-font font-black italic uppercase text-red-600 mb-6">${h.baslik}</h2><p class="text-zinc-300 text-lg leading-relaxed">${h.icerik}</p>`;
            document.getElementById('news-modal').classList.remove('hidden');
        }
        function modalKapat() { document.getElementById('news-modal').classList.add('hidden'); }
        function haberEkle() {
            const t = document.getElementById('news-title').value; const c = document.getElementById('news-content').value;
            if(t && c) { haberler.push({baslik:t, icerik:c}); localStorage.setItem('mpl_haberler', JSON.stringify(haberler)); location.reload(); }
        }
        function adminLogin() { if (prompt("ŞİFRE:") === "c2014add") document.getElementById('news-admin').classList.toggle('hidden'); }
        window.onload = haberleriGoster;
    </script>
</body>
</html>
