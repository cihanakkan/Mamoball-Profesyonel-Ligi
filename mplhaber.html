<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPL - Haberler & Yorumlar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #000; color: white; margin: 0; }
        .title-font { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .comment-box { border-left: 2px solid #dc2626; background: rgba(220, 38, 38, 0.05); }
    </style>
</head>
<body class="min-h-screen">
    <header class="py-12 text-center glass border-b border-red-900/20">
        <img src="https://raw.githubusercontent.com/cihanakk/Mamoball-Profesyonel-Ligi/main/1000090222.webp" class="w-24 h-24 mx-auto rounded-full mb-6 shadow-2xl">
        <h1 class="text-4xl title-font font-black italic uppercase text-red-600 tracking-tighter">MPL NEWS</h1>
        <a href="index.html" class="text-[10px] tracking-widest text-zinc-500 hover:text-white transition mt-4 inline-block font-bold uppercase">← GERİ</a>
    </header>

    <main class="max-w-4xl mx-auto px-6 py-12">
        <section id="news-admin" class="hidden glass p-6 rounded-[2rem] border border-red-600 mb-10 space-y-4">
            <h2 class="text-center font-black text-red-600 uppercase italic">YENİ HABER YAYINLA</h2>
            <input type="text" id="news-title" placeholder="HABER BAŞLIĞI" class="w-full bg-black/50 p-4 rounded-xl border border-zinc-800 outline-none uppercase font-bold text-xs text-white">
            <textarea id="news-content" placeholder="HABER İÇERİĞİ" class="w-full bg-black/50 p-4 rounded-xl h-24 border border-zinc-800 outline-none text-xs text-white"></textarea>
            <button onclick="haberEkle()" class="w-full bg-red-600 p-4 rounded-xl font-black uppercase text-xs shadow-lg">PAYLAŞ</button>
        </section>

        <div id="news-container" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    </main>

    <div id="news-modal" class="fixed inset-0 bg-black/98 z-[100] hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="max-w-2xl w-full glass rounded-[2.5rem] p-8 relative border border-white/10 my-10">
            <button onclick="modalKapat()" class="absolute top-6 right-6 text-zinc-500 text-3xl font-black hover:text-white">&times;</button>
            
            <div id="modal-content" class="mb-10 text-center"></div>

            <div class="border-t border-white/10 pt-6">
                <h4 class="text-xs font-black text-red-600 uppercase tracking-widest mb-4">YORUMLAR</h4>
                <div id="comments-list" class="space-y-4 mb-6 max-h-60 overflow-y-auto pr-2"></div>
                
                <div class="flex gap-2">
                    <input type="text" id="comment-input" placeholder="YORUMUNU YAZ..." class="flex-1 bg-white/5 p-3 rounded-lg border border-white/10 outline-none text-xs uppercase font-bold text-white focus:border-red-600 transition">
                    <button onclick="yorumYap()" class="bg-red-600 px-6 py-3 rounded-lg font-black text-xs uppercase">GÖNDER</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let haberler = JSON.parse(localStorage.getItem('mpl_haberler')) || [];
        let seciliHaberIndex = null;
        const currentUser = JSON.parse(sessionStorage.getItem('loggedInUser'));

        function haberleriGoster() {
            const container = document.getElementById('news-container'); container.innerHTML = '';
            [...haberler].reverse().forEach((h, i) => { 
                const ri = haberler.length-1-i;
                container.innerHTML += `<article onclick="haberAc(${ri})" class="glass p-8 rounded-[2rem] cursor-pointer hover:border-red-600 transition uppercase italic font-bold text-center">
                    <h3 class="text-xl mb-2">${h.baslik}</h3>
                    <p class="text-[9px] text-zinc-500 tracking-widest uppercase">YORUMLAR (${h.comments ? h.comments.length : 0}) →</p>
                </article>`; 
            });
            checkAdmin();
        }

        function checkAdmin() {
            if(currentUser && (currentUser.rank === "KURUCU" || currentUser.rank === "ADMİN" || currentUser.rank === "KURUCU ORTAĞI")) { 
                document.getElementById('news-admin').classList.remove('hidden'); 
            }
        }

        function haberAc(i) {
            seciliHaberIndex = i;
            const h = haberler[i];
            document.getElementById('modal-content').innerHTML = `<h2 class="text-3xl title-font font-black italic uppercase text-red-600 mb-4">${h.baslik}</h2><p class="text-zinc-300 text-sm leading-relaxed">${h.icerik}</p>`;
            yorumlarıGoster();
            document.getElementById('news-modal').classList.remove('hidden');
        }

        function yorumlarıGoster() {
            const list = document.getElementById('comments-list');
            list.innerHTML = '';
            const h = haberler[seciliHaberIndex];
            if(h.comments && h.comments.length > 0) {
                h.comments.forEach(c => {
                    list.innerHTML += `<div class="comment-box p-3 rounded-r-lg text-left">
                        <p class="text-[10px] font-black text-red-500 mb-1">${c.user}</p>
                        <p class="text-[11px] text-zinc-300 font-medium">${c.text}</p>
                    </div>`;
                });
            } else {
                list.innerHTML = `<p class="text-[10px] text-zinc-600 italic">HENÜZ YORUM YOK. İLK SEN YAZ!</p>`;
            }
        }

        function yorumYap() {
            const input = document.getElementById('comment-input');
            if(!input.value.trim() || !currentUser) return;
            
            if(!haberler[seciliHaberIndex].comments) haberler[seciliHaberIndex].comments = [];
            
            haberler[seciliHaberIndex].comments.push({
                user: currentUser.username,
                text: input.value.trim()
            });

            localStorage.setItem('mpl_haberler', JSON.stringify(haberler));
            input.value = '';
            yorumlarıGoster();
        }

        function modalKapat() { document.getElementById('news-modal').classList.add('hidden'); haberleriGoster(); }

        function haberEkle() {
            const t = document.getElementById('news-title').value; 
            const c = document.getElementById('news-content').value;
            if(t && c) { 
                haberler.push({baslik:t, icerik:c, comments: []}); 
                localStorage.setItem('mpl_haberler', JSON.stringify(haberler)); 
                location.reload(); 
            }
        }

        window.onload = () => {
            if(!currentUser) { alert("ÖNCE GİRİŞ YAP!"); location.href = 'index.html'; }
            haberleriGoster();
        };
    </script>
</body>
</html>
