<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPL - Haberler</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #000; color: white; }
        .title-font { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="min-h-screen">
    <button onclick="adminLogin()" class="fixed top-4 right-4 z-50 p-2 glass rounded-full opacity-20">⚙️</button>
    <header class="py-12 text-center glass border-b border-red-900/20">
        <img src="https://res.cloudinary.com/djp9v6pka/image/upload/v1740310000/mpl-logo.webp" class="w-24 h-24 mx-auto rounded-full mb-6 shadow-2xl">
        <h1 class="text-5xl title-font font-black italic uppercase tracking-tighter">MPL<span class="text-red-600 text-4xl">NEWS</span></h1>
        <a href="index.html" class="text-[10px] tracking-widest text-zinc-500 hover:text-white transition mt-4 inline-block uppercase font-bold">← ANA SAYFA</a>
    </header>
    <main class="max-w-5xl mx-auto px-6 py-12">
        <section id="news-admin" class="hidden glass p-10 rounded-[3rem] border border-red-600 mb-12 space-y-4">
            <input type="text" id="news-title" placeholder="BAŞLIK" class="w-full bg-black/50 p-5 rounded-2xl outline-none border border-zinc-800 focus:border-red-600 font-bold uppercase">
            <textarea id="news-content" placeholder="HABER DETAYI" class="w-full bg-black/50 p-5 rounded-2xl h-32 border border-zinc-800 outline-none"></textarea>
            <input type="text" id="news-image-url" placeholder="RESİM LİNKİ" class="w-full bg-black/50 p-5 rounded-2xl border border-zinc-800 outline-none">
            <button onclick="haberEkle()" class="w-full bg-red-600 p-5 rounded-2xl font-black uppercase shadow-lg">HABERİ PATLAT 🚀</button>
        </section>
        <div id="news-container" class="grid grid-cols-1 md:grid-cols-2 gap-8 pb-20"></div>
    </main>
    <div id="news-modal" class="fixed inset-0 bg-black/95 z-[100] hidden overflow-y-auto p-4 flex items-center justify-center">
        <div class="max-w-4xl w-full glass rounded-[4rem] overflow-hidden relative border border-white/5 shadow-2xl">
            <button onclick="modalKapat()" class="absolute top-8 right-8 text-zinc-500 hover:text-red-600 text-4xl font-black z-50">&times;</button>
            <div id="modal-content" class="p-10 md:p-16 text-center"></div>
            <div class="bg-black/50 p-10 border-t border-white/5">
                <h4 class="title-font text-red-600 font-black italic mb-8 uppercase text-sm">YORUMLAR</h4>
                <div id="comment-list" class="space-y-4 mb-8"></div>
                <div class="grid gap-3">
                    <input type="text" id="comment-name" placeholder="ADINIZ" class="bg-black p-4 rounded-xl border border-zinc-800 outline-none uppercase text-xs text-white">
                    <textarea id="comment-text" placeholder="YORUM..." class="bg-black p-4 rounded-xl border border-zinc-800 h-24 text-sm text-white"></textarea>
                    <div class="flex items-center justify-between"><span id="bot-soru" class="text-[10px] font-black text-zinc-500 uppercase italic"></span><input type="number" id="bot-cevap" class="w-16 bg-red-900/20 p-2 rounded border border-red-600 text-center text-red-500 font-black"></div>
                    <button onclick="yorumYap()" class="bg-red-600 p-4 rounded-xl font-black uppercase text-xs">GÖNDER</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        let haberler = JSON.parse(localStorage.getItem('mpl_haberler')) || []; let aktifHaberIndex = null; let dogruCevap = 0;
        function botKontrol() { const n1 = Math.floor(Math.random()*9)+1; const n2 = Math.floor(Math.random()*9)+1; dogruCevap = n1+n2; document.getElementById('bot-soru').innerText = `BOT SAVAR: ${n1} + ${n2} = ?`; }
        function haberleriGoster() {
            const c = document.getElementById('news-container'); c.innerHTML = '';
            [...haberler].reverse().forEach((h, i) => { const ri = haberler.length-1-i; const img = h.image_url ? `<img src="${h.image_url}" class="w-full h-56 object-cover">` : `<div class="w-full h-56 bg-zinc-900 flex items-center justify-center font-black opacity-20">MPL</div>`;
            c.innerHTML += `<article onclick="haberAc(${ri})" class="glass rounded-[3rem] overflow-hidden group cursor-pointer border border-transparent hover:border-red-600 transition"><div class="relative overflow-hidden">${img}</div><div class="p-10"><h3 class="text-3xl title-font font-black italic uppercase leading-none mb-4 group-hover:text-red-500 transition">${h.baslik}</h3><p class="text-zinc-500 text-[10px] font-black tracking-widest uppercase">HABERE GİT →</p></div></article>`; });
        }
        function haberAc(i) {
            aktifHaberIndex = i; const h = haberler[i];
            document.getElementById('modal-content').innerHTML = `<h2 class="text-5xl title-font font-black italic uppercase text-white leading-none tracking-tighter mb-8">${h.baslik}</h2>${h.image_url ? `<img src="${h.image_url}" class="w-full rounded-[2rem] mb-10 border border-white/5 shadow-2xl">` : ''}<p class="text-zinc-300 text-xl font-medium leading-relaxed">${h.icerik}</p>`;
            botKontrol(); yorumlarıGoster(); document.getElementById('news-modal').classList.remove('hidden'); document.body.style.overflow = 'hidden';
        }
        function modalKapat() { document.getElementById('news-modal').classList.add('hidden'); document.body.style.overflow = 'auto'; }
        function yorumYap() {
            const ad = document.getElementById('comment-name').value; const met = document.getElementById('comment-text').value; const cev = parseInt(document.getElementById('bot-cevap').value);
            if(cev !== dogruCevap) { alert("HATALI!"); return; }
            if(ad && met) { if(!haberler[aktifHaberIndex].yorumlar) haberler[aktifHaberIndex].yorumlar = [];
            haberler[aktifHaberIndex].yorumlar.push({ad, met, saat: new Date().toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'})});
            localStorage.setItem('mpl_haberler', JSON.stringify(haberler)); document.getElementById('comment-name').value = ''; document.getElementById('comment-text').value = ''; botKontrol(); yorumlarıGoster(); }
        }
        function yorumlarıGoster() {
            const list = document.getElementById('comment-list'); list.innerHTML = '';
            (haberler[aktifHaberIndex].yorumlar || []).forEach(y => { list.innerHTML += `<div class="bg-white/5 p-5 rounded-2xl text-left border border-white/5"><div class="flex justify-between items-center mb-1"><span class="text-red-600 font-black text-[12px] uppercase">${y.ad}</span><span class="text-[9px] text-zinc-600">${y.saat || ''}</span></div><p class="text-zinc-400 text-sm italic font-medium">"${y.met}"</p></div>`; });
        }
        function haberEkle() {
            const t = document.getElementById('news-title').value; const c = document.getElementById('news-content').value; const i = document.getElementById('news-image-url').value;
            if(t && c) { haberler.push({baslik:t, icerik:c, image_url:i, tarih:new Date().toLocaleDateString('tr-TR'), yorumlar:[]}); localStorage.setItem('mpl_haberler', JSON.stringify(haberler)); document.getElementById('news-title').value=''; document.getElementById('news-content').value=''; haberleriGoster(); alert("BOMBA PATLATILDI."); }
        }
        function adminLogin() { if (prompt("ŞİFRE:") === "c2014add") document.getElementById('news-admin').classList.toggle('hidden'); }
        window.onload = haberleriGoster;
    </script>
</body>
</html>
