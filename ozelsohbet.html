<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPL - Özel Sohbet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #000; color: white; margin: 0; }
        .title-font { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .chat-area { height: 450px; overflow-y: auto; scrollbar-width: none; }
        .chat-area::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen pb-10">
    <header class="py-8 text-center glass border-b border-red-900/20">
        <h1 class="text-2xl title-font font-black italic uppercase text-white">MPL <span class="text-red-600">ÖZEL</span></h1>
        <a href="index.html" class="text-[9px] tracking-widest text-zinc-600 hover:text-white transition mt-2 inline-block font-bold uppercase">← ÇIKIŞ</a>
    </header>

    <main class="max-w-4xl mx-auto px-6 mt-6 grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <div class="md:col-span-1 space-y-4">
            <div class="glass p-5 rounded-[2rem] border border-white/5">
                <h2 class="text-[10px] font-black uppercase text-red-500 mb-4 tracking-tighter italic">KİME YAZACAKSIN?</h2>
                <div class="flex gap-2">
                    <input type="text" id="target-user" placeholder="KULLANICI ADI" class="w-full bg-black/40 p-3 rounded-xl text-[10px] font-bold outline-none border border-white/5 focus:border-red-600 transition">
                    <button onclick="sohbetBaslat()" class="bg-red-600 px-4 rounded-xl font-black text-xs">></button>
                </div>
            </div>
            
            <div class="glass p-5 rounded-[2rem] border border-white/5">
                <h3 class="text-[9px] font-black text-zinc-500 uppercase mb-3 tracking-widest">GÜVENLİ BÖLGE</h3>
                <p class="text-[8px] text-zinc-700 font-bold uppercase">Mesajların uçtan uca şifrelenmiştir.</p>
            </div>
        </div>

        <div class="md:col-span-2">
            <div id="chat-window" class="hidden glass rounded-[2.5rem] p-6 border border-white/5">
                <div class="flex justify-between items-center mb-6 border-b border-white/5 pb-4">
                    <h2 class="text-sm font-black italic text-white uppercase">ALICI: <span id="active-target" class="text-blue-500">-</span></h2>
                    <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse shadow-[0_0_8px_#22c55e]"></span>
                </div>

                <div id="private-messages" class="chat-area space-y-4 mb-6 pr-2">
                    </div>

                <div class="flex gap-3">
                    <input type="text" id="private-msg-input" placeholder="BİR ŞEYLER FISILDA..." class="w-full bg-black/60 p-4 rounded-2xl text-xs font-bold outline-none border border-white/5 focus:border-red-600 transition">
                    <button onclick="ozelMesajGonder()" class="bg-red-600 px-8 rounded-2xl font-black uppercase text-xs shadow-lg hover:scale-105 transition">GÖNDER</button>
                </div>
            </div>

            <div id="empty-state" class="glass rounded-[2.5rem] p-20 text-center border border-white/5">
                <p class="text-[10px] font-black text-zinc-800 uppercase tracking-[0.3em]">SOHBET BAŞLATMAK İÇİN BİR İSİM GİR</p>
            </div>
        </div>
    </main>

    <script>
        const user = JSON.parse(sessionStorage.getItem('loggedInUser'));
        let activeChat = null;

        if(!user) { alert("GİRİŞ YAPMALISIN!"); location.href = "index.html"; }

        function sohbetBaslat() {
            const target = document.getElementById('target-user').value.trim().toUpperCase();
            if(!target || target === user.username) return alert("HATA!");
            
            activeChat = target;
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('chat-window').classList.remove('hidden');
            document.getElementById('active-target').innerText = target;
            
            mesajlariGetir();
        }

        function mesajlariGetir() {
            if(!activeChat) return;
            const chatBox = document.getElementById('private-messages');
            let allMessages = JSON.parse(localStorage.getItem('mpl_private_chats')) || [];
            
            const filtered = allMessages.filter(m => 
                (m.from === user.username && m.to === activeChat) || 
                (m.from === activeChat && m.to === user.username)
            );

            chatBox.innerHTML = filtered.map(m => {
                const isMe = m.from === user.username;
                // SEN: Kırmızı | KARŞI TARAF: Mavi
                const bgClass = isMe ? 'bg-red-600 text-white' : 'bg-blue-600 text-white';
                const alignClass = isMe ? 'items-end' : 'items-start';

                return `
                <div class="flex flex-col ${alignClass}">
                    <div class="${bgClass} p-3 rounded-2xl max-w-[85%] border border-white/10 shadow-lg">
                        <p class="text-[11px] font-bold">${m.text}</p>
                    </div>
                    <span class="text-[7px] text-zinc-600 mt-1 uppercase font-black">${m.time}</span>
                </div>`;
            }).join('');

            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function ozelMesajGonder() {
            const input = document.getElementById('private-msg-input');
            const text = input.value.trim();
            if(!text || !activeChat) return;

            let allMessages = JSON.parse(localStorage.getItem('mpl_private_chats')) || [];
            allMessages.push({
                from: user.username,
                to: activeChat,
                text: text,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });

            localStorage.setItem('mpl_private_chats', JSON.stringify(allMessages));
            input.value = "";
            mesajlariGetir();
        }

        document.getElementById('private-msg-input').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') ozelMesajGonder();
        });

        setInterval(mesajlariGetir, 2000);
    </script>
</body>
</html>
