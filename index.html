<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPL - Giriş & Yönetim</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@400;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: radial-gradient(circle at top, #1a0a0a 0%, #000 100%); color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
        .title-font { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .neon-border { border: 1px solid rgba(220, 38, 38, 0.5); box-shadow: 0 0 20px rgba(220, 38, 38, 0.2); }
    </style>
</head>
<body class="p-6">
    <main id="auth-box" class="max-w-md w-full glass p-10 rounded-[3rem] neon-border text-center">
        <h1 class="text-6xl title-font font-black italic mb-2 tracking-tighter text-white">MPL<span class="text-red-600">.</span></h1>
        <p id="auth-title" class="text-[10px] tracking-[0.5em] text-zinc-500 font-bold mb-8 uppercase">SİSTEME GİRİŞ YAP</p>
        <div class="space-y-4">
            <input type="text" id="username" placeholder="KULLANICI ADI" class="w-full bg-black/50 p-4 rounded-xl border border-zinc-800 outline-none uppercase font-bold text-xs focus:border-red-600 transition text-white">
            <input type="password" id="password" placeholder="ŞİFRE" class="w-full bg-black/50 p-4 rounded-xl border border-zinc-800 outline-none uppercase font-bold text-xs focus:border-red-600 transition text-white">
            <button onclick="handleAuth()" class="w-full bg-red-600 p-4 rounded-xl font-black uppercase text-sm hover:scale-105 transition shadow-lg shadow-red-900/20">GİRİŞ YAP</button>
            <p onclick="toggleAuth()" id="toggle-text" class="text-[9px] text-zinc-500 cursor-pointer hover:text-white mt-4 uppercase tracking-widest font-bold">YENİ KAYIT OLUŞTUR</p>
        </div>
    </main>

    <main id="main-menu" class="hidden max-w-md w-full space-y-10 text-center">
        <header>
            <img src="https://raw.githubusercontent.com/cihanakk/Mamoball-Profesyonel-Ligi/main/1000090222.webp" class="w-40 h-40 mx-auto rounded-full mb-6 border-2 border-red-600 shadow-[0_0_50px_rgba(220,38,38,0.4)]">
            <h2 id="welcome-msg" class="text-2xl title-font font-black italic uppercase"></h2>
            <p id="rank-msg" class="text-red-600 text-[10px] font-black tracking-widest uppercase mb-4"></p>
            <div class="flex justify-center gap-4">
                <button onclick="changePass()" class="text-[8px] text-zinc-400 font-bold tracking-widest uppercase underline">ŞİFRE DEĞİŞTİR</button>
                <button onclick="logout()" class="text-[8px] text-red-500 font-bold tracking-widest uppercase underline">ÇIKIŞ YAP</button>
            </div>
        </header>
        <div class="grid grid-cols-1 gap-4 px-4">
            <a href="puantablosu.html" class="glass py-10 rounded-[3rem] hover:bg-red-600/10 transition-all border border-white/5"><h2 class="text-2xl title-font font-black italic uppercase text-white">TABLO</h2></a>
            <a href="mplhaber.html" class="glass py-10 rounded-[3rem] hover:bg-red-600/10 transition-all border border-white/5"><h2 class="text-2xl title-font font-black italic uppercase text-white">HABERLER</h2></a>
        </div>
    </main>

    <script>
        let isLogin = true;
        const staff = [
            {username: "3LosTSouL4", password: "c2014add", rank: "KURUCU"},
            {username: "TheKing", password: "Hga2009", rank: "KURUCU ORTAĞI"},
            {username: "Musticardi", password: "Veneto2010", rank: "ADMİN"},
            {username: "Rennex", password: "MPLADMİN2024", rank: "ADMİN"}
        ];

        function toggleAuth() { isLogin = !isLogin; document.getElementById('auth-title').innerText = isLogin ? "GİRİŞ YAP" : "KAYIT OL"; }

        function handleAuth() {
            const uInput = document.getElementById('username').value.trim();
            const pInput = document.getElementById('password').value.trim();
            if(!uInput || !pInput) return alert("BOŞ BIRAKMA!");

            let users = JSON.parse(localStorage.getItem('mpl_users')) || [];
            
            if(isLogin) {
                // ÖNCE ADMIN KONTROLÜ
                const admin = staff.find(s => s.username.toUpperCase() === uInput.toUpperCase());
                if(admin) {
                    const savedPass = localStorage.getItem('pass_' + admin.username.toLowerCase());
                    const currentPass = savedPass || admin.password;
                    
                    if(pInput === currentPass) {
                        sessionStorage.setItem('loggedInUser', JSON.stringify({...admin, password: currentPass}));
                        return showMenu(admin);
                    }
                }

                // SONRA NORMAL KULLANICI KONTROLÜ
                const normal = users.find(x => x.username.toUpperCase() === uInput.toUpperCase() && x.password === pInput);
                if(normal) {
                    sessionStorage.setItem('loggedInUser', JSON.stringify(normal));
                    return showMenu(normal);
                }
                
                alert("HATALI GİRİŞ!");
            } else {
                // KAYIT OLMA
                if(staff.find(s => s.username.toUpperCase() === uInput.toUpperCase()) || users.find(x => x.username.toUpperCase() === uInput.toUpperCase())) {
                    return alert("BU İSİM KULLANILIYOR!");
                }
                users.push({username: uInput, password: pInput, rank: "OYUNCU"});
                localStorage.setItem('mpl_users', JSON.stringify(users));
                alert("KAYIT BAŞARILI!"); toggleAuth();
            }
        }

        function changePass() {
            const user = JSON.parse(sessionStorage.getItem('loggedInUser'));
            const newP = prompt("YENİ ŞİFRE:");
            if(newP && newP.length > 3) {
                localStorage.setItem('pass_' + user.username.toLowerCase(), newP);
                // Normal kullanıcıysa listesini güncelle
                let users = JSON.parse(localStorage.getItem('mpl_users')) || [];
                let idx = users.findIndex(x => x.username.toLowerCase() === user.username.toLowerCase());
                if(idx !== -1) { users[idx].password = newP; localStorage.setItem('mpl_users', JSON.stringify(users)); }
                alert("ŞİFRE DEĞİŞTİ. TEKRAR GİRİŞ YAP!"); logout();
            }
        }

        function showMenu(user) {
            document.getElementById('auth-box').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
            document.getElementById('welcome-msg').innerText = "HOŞ GELDİN, " + user.username;
            document.getElementById('rank-msg').innerText = user.rank;
        }

        function logout() { sessionStorage.removeItem('loggedInUser'); location.reload(); }
        window.onload = () => { const user = JSON.parse(sessionStorage.getItem('loggedInUser')); if(user) showMenu(user); }
    </script>
</body>
</html>
