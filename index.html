<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPL - Giriş</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@400;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: radial-gradient(circle at top, #1a0a0a 0%, #000 100%); color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
        .title-font { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .neon-border { border: 1px solid rgba(220, 38, 38, 0.5); box-shadow: 0 0 20px rgba(220, 38, 38, 0.2); }
    </style>
</head>
<body class="p-6">
    <main id="auth-box" class="max-w-md w-full glass p-10 rounded-[3rem] neon-border text-center">
        <h1 class="text-6xl title-font font-black italic mb-2 tracking-tighter">MPL<span class="text-red-600">.</span></h1>
        <p id="auth-title" class="text-[10px] tracking-[0.5em] text-zinc-500 font-bold mb-8 uppercase">YÖNETİM & OYUNCU GİRİŞİ</p>
        
        <div class="space-y-4">
            <input type="text" id="username" placeholder="KULLANICI ADI" class="w-full bg-black/50 p-4 rounded-xl border border-zinc-800 outline-none uppercase font-bold text-xs focus:border-red-600 transition text-white">
            <input type="password" id="password" placeholder="ŞİFRE" class="w-full bg-black/50 p-4 rounded-xl border border-zinc-800 outline-none uppercase font-bold text-xs focus:border-red-600 transition text-white">
            <button onclick="handleAuth()" id="auth-btn" class="w-full bg-red-600 p-4 rounded-xl font-black uppercase text-sm hover:scale-105 transition active:scale-95 shadow-lg shadow-red-900/20">GİRİŞ YAP</button>
            <p onclick="toggleAuth()" id="toggle-text" class="text-[9px] text-zinc-500 cursor-pointer hover:text-white mt-4 uppercase tracking-widest font-bold">YENİ OYUNCU KAYDI</p>
        </div>
    </main>

    <main id="main-menu" class="hidden max-w-md w-full space-y-12 text-center">
        <header>
            <img src="https://raw.githubusercontent.com/cihanakk/Mamoball-Profesyonel-Ligi/main/1000090222.webp" class="w-40 h-40 mx-auto rounded-full mb-6 border-2 border-red-600 shadow-[0_0_50px_rgba(220,38,38,0.4)]">
            <h2 id="welcome-msg" class="text-2xl title-font font-black italic uppercase"></h2>
            <p id="rank-msg" class="text-red-600 text-[10px] font-black tracking-widest uppercase"></p>
            <button onclick="logout()" class="text-[8px] text-zinc-500 font-bold tracking-[0.5em] mt-4 uppercase underline">ÇIKIŞ YAP</button>
        </header>

        <div class="grid grid-cols-1 gap-6 px-4">
            <a href="puantablosu.html" class="glass py-10 rounded-[3rem] hover:bg-red-600/10 transition-all border border-white/5">
                <h2 class="text-2xl title-font font-black italic uppercase">TABLO</h2>
            </a>
            <a href="mplhaber.html" class="glass py-10 rounded-[3rem] hover:bg-red-600/10 transition-all border border-white/5">
                <h2 class="text-2xl title-font font-black italic uppercase">HABERLER</h2>
            </a>
        </div>
    </main>

    <script>
        let isLogin = true;
        // OTOMATİK EKLEME: Kurucu ve Adminler burada tanımlı
        const staff = [
            {username: "3LosTSouL4", password: "c2014add", rank: "KURUCU"},
            {username: "Musticardi", password: "Veneto2010", rank: "ADMİN"},
            {username: "Rennex", password: "MPL2024", rank: "ADMİN"}
        ];

        let users = JSON.parse(localStorage.getItem('mpl_users')) || [];

        function toggleAuth() {
            isLogin = !isLogin;
            document.getElementById('auth-title').innerText = isLogin ? "GİRİŞ YAP" : "KAYIT OL";
            document.getElementById('auth-btn').innerText = isLogin ? "GİRİŞ YAP" : "KAYIT OL";
        }

        function handleAuth() {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();

            if(!u || !p) return alert("BOŞ BIRAKMA!");

            if(isLogin) {
                // Önce staff (admin) kontrolü, sonra normal kullanıcı
                const adminUser = staff.find(x => x.username.toLowerCase() === u.toLowerCase() && x.password === p);
                const normalUser = users.find(x => x.username.toLowerCase() === u.toLowerCase() && x.password === p);
                
                const foundUser = adminUser || normalUser;

                if(foundUser) {
                    sessionStorage.setItem('loggedInUser', JSON.stringify(foundUser));
                    showMenu(foundUser);
                } else {
                    alert("KULLANICI ADI VEYA ŞİFRE HATALI!");
                }
            } else {
                if(users.find(x => x.username.toLowerCase() === u.toLowerCase()) || staff.find(x => x.username.toLowerCase() === u.toLowerCase())) {
                    return alert("BU İSİM ZATEN VAR!");
                }
                users.push({username: u, password: p, rank: "OYUNCU"});
                localStorage.setItem('mpl_users', JSON.stringify(users));
                alert("KAYIT BAŞARILI! ŞİMDİ GİRİŞ YAP.");
                toggleAuth();
            }
        }

        function showMenu(user) {
            document.getElementById('auth-box').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
            document.getElementById('welcome-msg').innerText = "HOŞ GELDİN, " + user.username;
            document.getElementById('rank-msg').innerText = user.rank;
        }

        function logout() { sessionStorage.removeItem('loggedInUser'); location.reload(); }

        window.onload = () => {
            const user = JSON.parse(sessionStorage.getItem('loggedInUser'));
            if(user) showMenu(user);
        }
    </script>
</body>
</html>
