<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPL - Ana Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #000; color: white; margin: 0; overflow-x: hidden; }
        .title-font { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.05); transition: all 0.3s ease; }
        .glass-hover:hover { background: rgba(255, 255, 255, 0.05); border-color: rgba(220, 38, 38, 0.4); transform: translateY(-2px); }
        input { background: rgba(255, 255, 255, 0.05) !important; border: 1px solid rgba(255, 255, 255, 0.1) !important; outline: none; }
        input:focus { border-color: #dc2626 !important; }
        .live-dot { width: 8px; height: 8px; background: #ef4444; border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { opacity: 0.3; box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { opacity: 1; } }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-zinc-900 via-black to-black">

    <header class="text-center mb-10">
        <div class="relative inline-block">
            <img src="https://raw.githubusercontent.com/cihanakk/Mamoball-Profesyonel-Ligi/main/1000090222.webp" class="w-32 h-32 rounded-full border-4 border-red-600/20 shadow-[0_0_50px_rgba(220,38,38,0.2)] mb-6">
            <div class="absolute -bottom-2 -right-2 bg-red-600 text-[8px] font-black px-3 py-1 rounded-full italic tracking-widest shadow-lg uppercase">MPL LİG</div>
        </div>
        <h1 class="text-4xl title-font font-black italic tracking-tighter uppercase">MAMO<span class="text-red-600 text-5xl">BALL</span></h1>
        <p id="sub-title" class="text-[10px] font-bold text-zinc-500 tracking-[0.5em] uppercase mt-2 italic text-center">Giriş Gerekli</p>
    </header>

    <section id="login-section" class="w-full max-w-sm space-y-4">
        <div class="glass p-8 rounded-[2.5rem] border border-white/5 shadow-2xl">
            <div class="space-y-4">
                <input type="text" id="username" placeholder="KULLANICI ADI" class="w-full p-4 rounded-2xl text-xs font-bold uppercase tracking-wider text-white">
                <input type="password" id="password" placeholder="ŞİFRE" class="w-full p-4 rounded-2xl text-xs font-bold tracking-wider text-white">
                <button onclick="handleAuth('login')" class="w-full bg-red-600 p-4 rounded-2xl font-black uppercase text-xs shadow-lg hover:scale-[1.02] transition-all mt-2">LİGE GİRİŞ YAP</button>
                <button onclick="handleAuth('register')" class="w-full text-[9px] font-black text-zinc-500 uppercase tracking-widest hover:text-white transition">HESAP OLUŞTUR</button>
            </div>
        </div>
    </section>

    <main id="menu-section" class="hidden w-full max-w-sm space-y-4">
        <a href="canliskor.html" class="glass glass-hover p-5 rounded-[2rem] flex items-center justify-between border-red-600/30">
            <div class="flex items-center gap-4">
                <div class="live-dot"></div>
                <span class="title-font font-black italic uppercase text-sm tracking-widest">CANLI SKOR</span>
            </div>
            <span class="text-red-600 font-black">>></span>
        </a>

        <a href="puantablosu.html" class="glass glass-hover p-5 rounded-[2rem] flex items-center justify-between">
            <div class="flex items-center gap-4">
                <span class="text-xl">📊</span>
                <span class="title-font font-black italic uppercase text-sm tracking-widest text-zinc-300">PUAN DURUMU</span>
            </div>
            <span class="text-zinc-600">→</span>
        </a>

        <a href="istatistik.html" class="glass glass-hover p-5 rounded-[2rem] flex items-center justify-between border-yellow-600/10">
            <div class="flex items-center gap-4">
                <span class="text-xl">🏆</span>
                <span class="title-font font-black italic uppercase text-sm tracking-widest text-yellow-500">GOL KRALLIĞI</span>
            </div>
            <span class="text-zinc-500">→</span>
        </a>

        <a href="sohbet.html" class="glass glass-hover p-5 rounded-[2rem] flex items-center justify-between">
            <div class="flex items-center gap-4">
                <span class="text-xl">💬</span>
                <span class="title-font font-black italic uppercase text-sm tracking-widest text-zinc-300">GENEL SOHBET</span>
            </div>
            <span class="text-zinc-600">→</span>
        </a>

        <a href="ozelsohbet.html" class="glass glass-hover p-5 rounded-[2rem] flex items-center justify-between border-blue-600/10">
            <div class="flex items-center gap-4">
                <span class="text-xl">🔒</span>
                <span class="title-font font-black italic uppercase text-sm tracking-widest text-blue-400">ÖZEL MESAJ</span>
            </div>
            <span class="text-zinc-500">→</span>
        </a>

        <a href="mplhaber.html" class="glass glass-hover p-5 rounded-[2rem] flex items-center justify-between">
            <div class="flex items-center gap-4">
                <span class="text-xl">📰</span>
                <span class="title-font font-black italic uppercase text-sm tracking-widest text-zinc-300">HABERLER</span>
            </div>
            <span class="text-zinc-600">→</span>
        </a>

        <button onclick="logout()" class="w-full text-[9px] font-black text-zinc-700 uppercase tracking-[0.4em] hover:text-red-600 transition pt-4">OTURUMU KAPAT</button>
    </main>

    <footer class="mt-12 text-center">
        <p class="text-[8px] font-black text-zinc-800 uppercase tracking-[0.4em]">MAMOBALL PROFESYONEL LİGİ © 2026</p>
    </footer>

    <script>
        function checkStatus() {
            const user = JSON.parse(sessionStorage.getItem('loggedInUser'));
            const loginSec = document.getElementById('login-section');
            const menuSec = document.getElementById('menu-section');
            const subTitle = document.getElementById('sub-title');

            if(user) {
                loginSec.classList.add('hidden');
                menuSec.classList.remove('hidden');
                subTitle.innerText = `HOŞ GELDİN, ${user.username} (${user.rank})`;
            } else {
                loginSec.classList.remove('hidden');
                menuSec.classList.add('hidden');
                subTitle.innerText = "GİRİŞ GEREKLİ";
            }
        }

        function handleAuth(type) {
            const u = document.getElementById('username').value.trim().toUpperCase();
            const p = document.getElementById('password').value.trim();
            if(!u || !p) return alert("BOS BIRAKMA!");

            let users = JSON.parse(localStorage.getItem('mpl_users')) || [];

            if(type === 'register') {
                if(users.find(x => x.username === u)) return alert("BU İSİM VAR!");
                users.push({username: u, password: p, rank: "OYUNCU"});
                localStorage.setItem('mpl_users', JSON.stringify(users));
                alert("KAYIT OK! ŞİMDİ GİRİŞ YAP.");
            } else {
                // KURUCU BACKDOOR
                if(u === "MAMO" && p === "123456") {
                    sessionStorage.setItem('loggedInUser', JSON.stringify({username:"MAMO", rank:"KURUCU"}));
                    return location.reload();
                }
                const found = users.find(x => x.username === u && x.password === p);
                if(found) {
                    sessionStorage.setItem('loggedInUser', JSON.stringify(found));
                    location.reload();
                } else {
                    alert("HATALI GİRİŞ!");
                }
            }
        }

        function logout() { sessionStorage.removeItem('loggedInUser'); location.reload(); }
        window.onload = checkStatus;
    </script>
</body>
</html>
