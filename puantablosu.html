<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPL - Puan Durumu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #000; color: white; margin: 0; }
        .title-font { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="min-h-screen pb-20">
    <header class="py-12 text-center glass border-b border-red-900/20">
        <img src="https://raw.githubusercontent.com/cihanakk/Mamoball-Profesyonel-Ligi/main/1000090222.webp" class="w-24 h-24 mx-auto rounded-full mb-6 border-2 border-red-600/30 shadow-2xl">
        <h1 class="text-4xl title-font font-black italic uppercase italic">PUAN <span class="text-red-600">TABLOSU</span></h1>
        <a href="index.html" class="text-[10px] tracking-widest text-zinc-500 hover:text-white transition mt-4 inline-block font-bold">← GERİ</a>
    </header>

    <main class="max-w-4xl mx-auto px-6 mt-10">
        <div class="glass rounded-[2rem] overflow-hidden">
            <table class="w-full text-left font-bold italic">
                <thead class="bg-red-600/10 text-[10px] text-red-500 tracking-widest uppercase">
                    <tr>
                        <th class="p-4">TAKIM</th>
                        <th class="p-4 text-center">O</th>
                        <th class="p-4 text-center">G</th>
                        <th class="p-4 text-center">P</th>
                    </tr>
                </thead>
                <tbody id="puan-tablosu" class="divide-y divide-white/5 uppercase">
                    </tbody>
            </table>
        </div>

        <section id="admin-panel" class="hidden mt-8 glass p-6 rounded-[2rem] border border-red-600">
            <h2 class="text-center font-black mb-4 text-red-600 uppercase italic">YÖNETİM PANELİ</h2>
            <div id="admin-inputs" class="space-y-2"></div>
            <button onclick="verileriKaydet()" class="w-full bg-red-600 p-4 rounded-xl font-black uppercase mt-6 shadow-lg hover:scale-[1.02] transition">VERİLERİ GÜNCELLE</button>
        </section>
    </main>

    <script>
        // İŞTE O EFSANE 6 TAKIM (ITALY FORMA DAHİL)
        let takımlar = JSON.parse(localStorage.getItem('mpl_veriler')) || [
            { ad: "BAYER LEVERKUSEN", o: 0, g: 0, p: 0 }, 
            { ad: "INTER FC", o: 0, g: 0, p: 0 }, 
            { ad: "ITALY FORMA", o: 0, g: 0, p: 0 }, 
            { ad: "TOTTENHAM", o: 0, g: 0, p: 0 }, 
            { ad: "HATAYSPOR", o: 0, g: 0, p: 0 }, 
            { ad: "FLAMENGO", o: 0, g: 0, p: 0 }
        ];

        function tabloyuCiz() {
            const tbody = document.getElementById('puan-tablosu'); 
            const adminInputs = document.getElementById('admin-inputs');
            tbody.innerHTML = ''; adminInputs.innerHTML = ''; 

            // Puana göre, eşitse galibiyete göre sırala
            takımlar.sort((a, b) => b.p - a.p || b.g - a.g);

            takımlar.forEach((tk, index) => {
                tbody.innerHTML += `
                    <tr class="hover:bg-white/5 transition">
                        <td class="p-4 text-white text-sm font-black">${tk.ad}</td>
                        <td class="p-4 text-center text-zinc-500">${tk.o}</td>
                        <td class="p-4 text-center text-zinc-500">${tk.g}</td>
                        <td class="p-4 text-center text-red-600 text-xl font-black">${tk.p}</td>
                    </tr>`;

                adminInputs.innerHTML += `
                    <div class="flex items-center gap-2 bg-black/40 p-2 rounded-lg text-[10px]">
                        <span class="w-1/3 font-black text-white uppercase">${tk.ad}</span>
                        <input type="number" value="${tk.o}" id="o-${index}" class="w-1/4 bg-zinc-900 p-2 rounded text-center text-white outline-none">
                        <input type="number" value="${tk.g}" id="g-${index}" class="w-1/4 bg-zinc-900 p-2 rounded text-center text-white outline-none">
                        <input type="number" value="${tk.p}" id="p-${index}" class="w-1/4 bg-red-900/30 p-2 rounded text-center text-red-500 font-black outline-none border border-red-600/20">
                    </div>`;
            });
            checkAdmin();
        }

        function checkAdmin() {
            const user = JSON.parse(sessionStorage.getItem('loggedInUser'));
            // Rank Kurucu veya Admin ise panel açılır
            if(user && (user.rank === "KURUCU" || user.rank === "ADMİN")) { 
                document.getElementById('admin-panel').classList.remove('hidden'); 
            }
        }

        function verileriKaydet() { 
            takımlar.forEach((tk, index) => { 
                tk.o = document.getElementById(`o-${index}`).value; 
                tk.g = document.getElementById(`g-${index}`).value; 
                tk.p = document.getElementById(`p-${index}`).value; 
            }); 
            localStorage.setItem('mpl_veriler', JSON.stringify(takımlar)); 
            tabloyuCiz(); 
            alert("TABLO GÜNCELLENDİ!"); 
        }

        window.onload = tabloyuCiz;
    </script>
</body>
</html>
