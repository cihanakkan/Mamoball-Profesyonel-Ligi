<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPL - Puan Durumu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #000; }
        .title-font { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .neon-border { border-bottom: 2px solid #dc2626; box-shadow: 0 4px 15px rgba(220, 38, 38, 0.3); }
    </style>
</head>
<body class="text-white min-h-screen">
    <button onclick="adminLogin()" class="fixed top-4 right-4 z-50 p-2 glass rounded-full hover:bg-red-600 transition-all opacity-20 hover:opacity-100">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" /></svg>
    </button>

    <header class="py-12 text-center glass border-b border-red-900/20">
        <a href="index.html" class="text-[10px] tracking-widest text-zinc-500 hover:text-red-500 font-black uppercase transition">← ANA SAYFA</a>
        <h1 class="text-5xl title-font font-black italic mt-4 uppercase">PUAN <span class="text-red-600">TABLOSU</span></h1>
    </header>

    <main class="max-w-4xl mx-auto px-6 py-16">
        <div class="glass rounded-[3rem] overflow-hidden shadow-2xl">
            <table class="w-full text-left border-collapse">
                <thead class="bg-red-600/10 text-[10px] font-black tracking-widest uppercase text-red-500">
                    <tr>
                        <th class="p-6">TAKIM</th>
                        <th class="p-6 text-center">O</th>
                        <th class="p-6 text-center">G</th>
                        <th class="p-6 text-center">P</th>
                    </tr>
                </thead>
                <tbody id="puan-tablosu" class="divide-y divide-white/5 font-bold uppercase italic"></tbody>
            </table>
        </div>

        <section id="admin-panel" class="hidden mt-12 glass p-10 rounded-[3rem] border border-red-600 animate-pulse">
            <h2 class="text-xl title-font font-black mb-6 text-red-600 italic">SIRALAMAYI GÜNCELLE</h2>
            <div id="admin-inputs" class="space-y-3"></div>
            <button onclick="verileriKaydet()" class="w-full bg-red-600 p-5 rounded-2xl font-black uppercase mt-8 hover:bg-red-700 transition shadow-lg active:scale-95">VERİLERİ BAS 🚀</button>
        </section>
    </main>

    <script>
        let takımlar = JSON.parse(localStorage.getItem('mpl_veriler')) || [
            { ad: "BAYER LEVERKUSEN", o: 0, g: 0, p: 0 },
            { ad: "INTER FC", o: 0, g: 0, p: 0 },
            { ad: "ITALY", o: 0, g: 0, p: 0 },
            { ad: "TOTTENHAM", o: 0, g: 0, p: 0 },
            { ad: "SPORTING LIZBON", o: 0, g: 0, p: 0 },
            { ad: "FLAMENGO", o: 0, g: 0, p: 0 }
        ];

        function tabloyuCiz() {
            const tbody = document.getElementById('puan-tablosu');
            const adminInputs = document.getElementById('admin-inputs');
            tbody.innerHTML = ''; adminInputs.innerHTML = '';
            takımlar.sort((a, b) => b.p - a.p || b.g - a.g);
            takımlar.forEach((tk, index) => {
                tbody.innerHTML += `<tr class="hover:bg-white/5 transition"><td class="p-6 text-white text-lg">${tk.ad}</td><td class="p-6 text-center text-zinc-500">${tk.o}</td><td class="p-6 text-center text-zinc-500">${tk.g}</td><td class="p-6 text-center text-red-600 text-2xl font-black">${tk.p}</td></tr>`;
                adminInputs.innerHTML += `<div class="flex items-center gap-2 bg-black/40 p-2 rounded-xl border border-white/5"><span class="w-1/3 text-[10px] font-black text-zinc-500 pl-2">${tk.ad}</span><input type="number" value="${tk.o}" id="o-${index}" class="w-1/4 bg-zinc-900 p-2 rounded text-center text-xs"><input type="number" value="${tk.g}" id="g-${index}" class="w-1/4 bg-zinc-900 p-2 rounded text-center text-xs text-zinc-500"><input type="number" value="${tk.p}" id="p-${index}" class="w-1/4 bg-red-900/30 p-2 rounded text-center text-sm font-black text-red-500"></div>`;
            });
        }

        function adminLogin() { if (prompt("ŞİFRE:") === "c2014add") { document.getElementById('admin-panel').classList.toggle('hidden'); window.scrollTo(0, document.body.scrollHeight); } }

        function verileriKaydet() {
            takımlar.forEach((tk, index) => {
                tk.o = document.getElementById(`o-${index}`).value;
                tk.g = document.getElementById(`g-${index}`).value;
                tk.p = document.getElementById(`p-${index}`).value;
            });
            localStorage.setItem('mpl_veriler', JSON.stringify(takımlar));
            tabloyuCiz();
            document.getElementById('admin-panel').classList.add('hidden');
            alert("PUANLAR GİRİLDİ BAŞKAN.");
        }
        window.onload = tabloyuCiz;
    </script>
</body>
</html>
