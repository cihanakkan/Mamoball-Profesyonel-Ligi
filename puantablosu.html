<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPL - Puan Durumu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #000; color: white; margin: 0; }
        .title-font { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="min-h-screen pb-20">
    <button onclick="adminLogin()" class="fixed top-4 right-4 z-50 p-2 glass rounded-full opacity-20">⚙️</button>
    <header class="py-12 text-center glass border-b border-red-900/20">
        <img src="./1000090222.webp" onerror="this.src='https://api.dicebear.com/7.x/initials/svg?seed=MPL&backgroundColor=dc2626&bold=true'" class="w-24 h-24 mx-auto rounded-full mb-6 shadow-2xl">
        <h1 class="text-4xl title-font font-black italic uppercase">PUAN <span class="text-red-600">TABLOSU</span></h1>
        <a href="index.html" class="text-[10px] tracking-widest text-zinc-500 hover:text-white transition mt-4 inline-block uppercase font-bold">← GERİ</a>
    </header>
    <main class="max-w-4xl mx-auto px-6 mt-10">
        <div class="glass rounded-[2rem] overflow-hidden"><table class="w-full text-left font-bold italic"><thead class="bg-red-600/10 text-[10px] text-red-500 tracking-widest uppercase"><th class="p-4">TAKIM</th><th class="p-4 text-center">O</th><th class="p-4 text-center">G</th><th class="p-4 text-center">P</th></thead><tbody id="puan-tablosu" class="divide-y divide-white/5 uppercase"></tbody></table></div>
        <section id="admin-panel" class="hidden mt-8 glass p-6 rounded-[2rem] border border-red-600"><div id="admin-inputs" class="space-y-2"></div><button onclick="verileriKaydet()" class="w-full bg-red-600 p-4 rounded-xl font-black uppercase mt-6">KAYDET</button></section>
    </main>
    <script>
        let takımlar = JSON.parse(localStorage.getItem('mpl_veriler')) || [{ ad: "BAYER LEVERKUSEN", o: 0, g: 0, p: 0 }, { ad: "INTER FC", o: 0, g: 0, p: 0 }, { ad: "ITALY", o: 0, g: 0, p: 0 }, { ad: "TOTTENHAM", o: 0, g: 0, p: 0 }, { ad: "SPORTING LIZBON", o: 0, g: 0, p: 0 }, { ad: "FLAMENGO", o: 0, g: 0, p: 0 }];
        function tabloyuCiz() {
            const tbody = document.getElementById('puan-tablosu'); const adminInputs = document.getElementById('admin-inputs');
            tbody.innerHTML = ''; adminInputs.innerHTML = ''; takımlar.sort((a, b) => b.p - a.p || b.g - a.g);
            takımlar.forEach((tk, index) => {
                tbody.innerHTML += `<tr><td class="p-4 text-white text-sm font-black">${tk.ad}</td><td class="p-4 text-center text-zinc-500">${tk.o}</td><td class="p-4 text-center text-zinc-500">${tk.g}</td><td class="p-4 text-center text-red-600 text-xl font-black">${tk.p}</td></tr>`;
                adminInputs.innerHTML += `<div class="flex items-center gap-2 bg-black/40 p-2 rounded-lg text-[10px]"><span class="w-1/3 font-black">${tk.ad}</span><input type="number" value="${tk.o}" id="o-${index}" class="w-1/4 bg-zinc-900 p-1 rounded text-center"><input type="number" value="${tk.g}" id="g-${index}" class="w-1/4 bg-zinc-900 p-1 rounded text-center"><input type="number" value="${tk.p}" id="p-${index}" class="w-1/4 bg-red-900/30 p-1 rounded text-center text-red-500 font-black"></div>`;
            });
        }
        function adminLogin() { if (prompt("ŞİFRE:") === "c2014add") { document.getElementById('admin-panel').classList.toggle('hidden'); } }
        function verileriKaydet() { takımlar.forEach((tk, index) => { tk.o = document.getElementById(`o-${index}`).value; tk.g = document.getElementById(`g-${index}`).value; tk.p = document.getElementById(`p-${index}`).value; }); localStorage.setItem('mpl_veriler', JSON.stringify(takımlar)); tabloyuCiz(); alert("OK."); }
        window.onload = tabloyuCiz;
    </script>
</body>
</html>
